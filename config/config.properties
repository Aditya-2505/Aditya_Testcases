# Mothercare Automation Framework Configuration
# Developer: Aditya Krishna

# Browser settings
browser=chrome
headless=false
window.maximize=true

# Website URL
base.url=https://mothercare.in/

# Timeouts (seconds)
implicit.wait=10
explicit.wait=20
page.load.timeout=60

# Output directories
screenshot.dir=screenshots
recording.dir=recordings
report.dir=reports
log.dir=logs

# Test data file
testdata.file=testdata/TestData.xlsx
testdata.sheet=TestData

# Extent Report
report.name=Mothercare Automation Report
report.title=Mothercare Test Execution Report

# Email settings (set enabled=true and fill in credentials to send report)
email.enabled=false
email.smtp.host=smtp.gmail.com
email.smtp.port=587
email.from=your-email@gmail.com
email.password=your-app-password
email.to=recipient@example.com
email.subject=Mothercare Automation Report

# Allure results directory
allure.results.dir=target/allure-results
